<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hospitalisation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="screen">
    <div class="stage" id="stage">
      <header class="topbar">
        <h1 class="topbar__title">Hospitalisation</h1>
        <button class="topbar__close" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </header>

      <!-- Scene: layers are positioned by app.js from the SCENE config -->
      <div class="scene" id="scene" role="img" aria-label="Hospital room illustration"></div>
    </div>

    <section class="intro">
      <h2 class="intro__headline">Find the right coverage to support your care preferences</h2>
      <p class="intro__body">Hospitalisation costs vary according to choice of treatment and hospital. With medical inflation at 10%, work out the coverage that best meets your preferences.</p>
    </section>

    <section class="considerations">
      <h3 class="considerations__title">Let's work on these considerations:</h3>
      <div class="cards" id="cards"></div>
    </section>

    <div class="commit-bar">
      <p class="commit-bar__status" id="commit-status">0 of 3 preferences chosen</p>
      <button class="commit-bar__btn" id="commit-btn" type="button" disabled>Confirm my preferences</button>
      <button class="commit-bar__reset" id="reset-btn" type="button" hidden>Start over</button>
    </div>

    <p class="sr-only" id="live" aria-live="polite"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
